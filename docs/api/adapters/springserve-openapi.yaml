components:
  schemas:
    AdapterCapabilities:
      additionalProperties: false
      description: Full response from ``GET /adapters/{adapter_type}/capabilities``.
      properties:
        contract_version:
          description: Version of this adapter's tenant-management contract.
          title: Contract Version
          type: string
        inventory_entity_label:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Inventory Entity Label
        openapi_url:
          description: Adapter-specific OpenAPI reference URL.
          title: Openapi Url
          type: string
        reporting_bundled_with_inventory:
          default: false
          title: Reporting Bundled With Inventory
          type: boolean
        supported_object_types:
          items:
            type: string
          title: Supported Object Types
          type: array
        supported_pricing_models:
          items:
            type: string
          title: Supported Pricing Models
          type: array
        supported_signal_types:
          items:
            type: string
          title: Supported Signal Types
          type: array
        supports_audiences:
          default: false
          title: Supports Audiences
          type: boolean
        supports_custom_targeting:
          default: false
          title: Supports Custom Targeting
          type: boolean
        supports_dynamic_products:
          default: false
          title: Supports Dynamic Products
          type: boolean
        supports_forecasting:
          default: false
          title: Supports Forecasting
          type: boolean
        supports_geo_targeting:
          default: false
          title: Supports Geo Targeting
          type: boolean
        supports_inventory_configuration_authoring:
          default: false
          title: Supports Inventory Configuration Authoring
          type: boolean
        supports_inventory_profiles:
          default: false
          title: Supports Inventory Profiles
          type: boolean
        supports_inventory_sync:
          default: false
          title: Supports Inventory Sync
          type: boolean
        supports_materialization_preview:
          default: false
          title: Supports Materialization Preview
          type: boolean
        supports_pricing_recommendations:
          default: false
          title: Supports Pricing Recommendations
          type: boolean
        supports_realtime_reporting:
          default: false
          title: Supports Realtime Reporting
          type: boolean
        supports_reporting:
          default: false
          title: Supports Reporting
          type: boolean
        supports_reporting_sync:
          default: false
          title: Supports Reporting Sync
          type: boolean
        supports_signal_mapping_authoring:
          default: false
          title: Supports Signal Mapping Authoring
          type: boolean
        supports_webhooks:
          default: false
          title: Supports Webhooks
          type: boolean
        sync_streams:
          items:
            type: string
          title: Sync Streams
          type: array
        type:
          description: Adapter type identifier.
          title: Type
          type: string
        unsupported_features:
          items:
            $ref: '#/components/schemas/AdapterUnsupportedFeature'
          title: Unsupported Features
          type: array
      required:
      - type
      - contract_version
      - openapi_url
      title: AdapterCapabilitiesResponse
      type: object
    AdapterConfig:
      additionalProperties: false
      description: 'SpringServe (Magnite) ad-server adapter configuration.


        Exactly one auth path is required: ``email`` + ``password`` (the

        canonical path -- the SpringServe API mints a 2-hour token from

        these credentials and the adapter caches + refreshes) or

        ``api_token`` (a pre-minted token, escape hatch for partner-

        provisioned tokens; no auto-refresh).'
      properties:
        api_token:
          anyOf:
          - format: password
            type: string
            writeOnly: true
          - type: 'null'
          default: null
          title: Api Token
        default_demand_partner_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Default Demand Partner Id
        demand_class:
          default: line_item
          enum:
          - line_item
          - tag
          title: Demand Class
          type: string
        email:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          default: null
          title: Email
        enable_key_value_targeting:
          default: false
          title: Enable Key Value Targeting
          type: boolean
        environment:
          const: production
          default: production
          title: Environment
          type: string
        password:
          anyOf:
          - format: password
            type: string
            writeOnly: true
          - type: 'null'
          default: null
          title: Password
        type:
          const: springserve
          default: springserve
          title: Type
          type: string
      title: SpringServeAdapterConfig
      type: object
    AdapterRuntimeConfig:
      additionalProperties: false
      description: SpringServe runtime settings that affect how buys are materialized.
      properties:
        default_demand_partner_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Fallback SpringServe Demand Partner ID for principals without
            an explicit SpringServe mapping.
          title: Default Demand Partner Id
        demand_class:
          default: line_item
          description: '''line_item'' means SpringServe hosts buyer creative assets;
            ''tag'' means buyer-supplied third-party VAST/audio tags pass through
            without creative binding.'
          enum:
          - line_item
          - tag
          title: Demand Class
          type: string
        enable_key_value_targeting:
          default: false
          description: Translate AdCP signals into SpringServe demand_tag_keys entries
            on created demand tags.
          title: Enable Key Value Targeting
          type: boolean
        type:
          const: springserve
          default: springserve
          title: Type
          type: string
      title: SpringServeSettings
      type: object
    AdapterSettingsSchemaResponse:
      additionalProperties: false
      description: Runtime adapter settings schema with template-macro metadata.
      properties:
        schema:
          additionalProperties: true
          title: Schema
          type: object
        template_macros:
          additionalProperties:
            items:
              $ref: '#/components/schemas/TemplateMacro'
            type: array
          title: Template Macros
          type: object
        type:
          title: Type
          type: string
      required:
      - type
      - schema
      title: AdapterSettingsSchemaResponse
      type: object
    AdapterSettingsValidationError:
      additionalProperties: false
      description: One validation error for adapter runtime settings.
      properties:
        field:
          title: Field
          type: string
        message:
          title: Message
          type: string
      required:
      - field
      - message
      title: AdapterSettingsValidationError
      type: object
    AdapterSettingsValidationResponse:
      additionalProperties: false
      description: Validation result for adapter runtime settings.
      properties:
        errors:
          items:
            $ref: '#/components/schemas/AdapterSettingsValidationError'
          title: Errors
          type: array
        preview:
          additionalProperties:
            type: string
          title: Preview
          type: object
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      title: AdapterSettingsValidationResponse
      type: object
    AdapterUnsupportedFeature:
      additionalProperties: false
      description: Machine-readable unsupported capability surfaced by adapter contracts.
      properties:
        feature:
          description: Stable unsupported feature identifier.
          minLength: 1
          title: Feature
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        remediation:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Remediation
      required:
      - feature
      - reason
      title: AdapterUnsupportedFeature
      type: object
    ApiError:
      additionalProperties: false
      description: Standard problem-detail shape used by every Tenant Management endpoint.
      properties:
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Details
        error:
          title: Error
          type: string
        message:
          title: Message
          type: string
      required:
      - error
      - message
      title: ApiError
      type: object
    TemplateMacro:
      additionalProperties: false
      description: One supported naming-template macro.
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
      required:
      - name
      - description
      title: TemplateMacro
      type: object
    UnsupportedFeature:
      additionalProperties: false
      description: Machine-readable unsupported capability surfaced by adapter contracts.
      properties:
        feature:
          description: Stable unsupported feature identifier.
          minLength: 1
          title: Feature
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        remediation:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Remediation
      required:
      - feature
      - reason
      title: AdapterUnsupportedFeature
      type: object
  securitySchemes:
    TenantManagementApiKey:
      in: header
      name: X-Tenant-Management-API-Key
      type: apiKey
externalDocs:
  description: Shared Tenant Management API OpenAPI document.
  url: ../tenant-management-openapi.json
info:
  description: Direct-sold CTV, online video, and audio inventory via Magnite's SpringServe
    ad server. This is an adapter-specific supplement. Shared tenant lifecycle, preview,
    status, sync, and test-connection operations are defined in the root Tenant Management
    OpenAPI document.
  title: Sales Agent Tenant Management Adapter Contract - SpringServe (Magnite)
  version: '2026-05-01'
openapi: 3.1.0
paths:
  /adapters/springserve/capabilities:
    get:
      operationId: get_springserve_capabilities
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterCapabilities'
          description: Adapter capabilities.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unknown adapter type.
      security:
      - TenantManagementApiKey: []
      summary: Get SpringServe (Magnite) tenant-management capabilities.
  /adapters/springserve/config-schema:
    get:
      operationId: get_springserve_config_schema
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterSettingsSchemaResponse'
          description: Adapter runtime configuration schema.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
      security:
      - TenantManagementApiKey: []
      summary: Get SpringServe (Magnite) runtime configuration schema.
  /adapters/springserve/openapi.json:
    get:
      operationId: get_springserve_openapi
      responses:
        '200':
          description: OpenAPI document.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unknown adapter type.
      security:
      - TenantManagementApiKey: []
      summary: Get SpringServe (Magnite) adapter contract OpenAPI document.
  /tenants/{tenant_id}/adapters/springserve/config:
    get:
      operationId: get_tenant_springserve_config
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterRuntimeConfig'
          description: Adapter runtime configuration.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant or adapter config not found.
      security:
      - TenantManagementApiKey: []
      summary: Get tenant SpringServe (Magnite) runtime configuration.
    put:
      operationId: put_tenant_springserve_config
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterRuntimeConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterRuntimeConfig'
          description: Updated adapter runtime configuration.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid adapter runtime configuration.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant or adapter config not found.
      security:
      - TenantManagementApiKey: []
      summary: Update tenant SpringServe (Magnite) runtime configuration.
  /tenants/{tenant_id}/adapters/springserve/config:validate:
    post:
      operationId: validate_tenant_springserve_config
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterRuntimeConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterSettingsValidationResponse'
          description: Adapter runtime configuration validation result.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Stored adapter connection configuration is incomplete.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant or adapter config not found.
      security:
      - TenantManagementApiKey: []
      summary: Validate tenant SpringServe (Magnite) runtime configuration.
security:
- TenantManagementApiKey: []
servers:
- url: /api/v1/tenant-management
x-salesagent-adapter: springserve
