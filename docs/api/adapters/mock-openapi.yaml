components:
  schemas:
    AdapterCapabilities:
      additionalProperties: false
      description: Full response from ``GET /adapters/{adapter_type}/capabilities``.
      properties:
        contract_version:
          description: Version of this adapter's tenant-management contract.
          title: Contract Version
          type: string
        inventory_entity_label:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Inventory Entity Label
        openapi_url:
          description: Adapter-specific OpenAPI reference URL.
          title: Openapi Url
          type: string
        reporting_bundled_with_inventory:
          default: false
          title: Reporting Bundled With Inventory
          type: boolean
        supported_object_types:
          items:
            type: string
          title: Supported Object Types
          type: array
        supported_pricing_models:
          items:
            type: string
          title: Supported Pricing Models
          type: array
        supported_signal_types:
          items:
            type: string
          title: Supported Signal Types
          type: array
        supports_audiences:
          default: false
          title: Supports Audiences
          type: boolean
        supports_custom_targeting:
          default: false
          title: Supports Custom Targeting
          type: boolean
        supports_dynamic_products:
          default: false
          title: Supports Dynamic Products
          type: boolean
        supports_forecasting:
          default: false
          title: Supports Forecasting
          type: boolean
        supports_geo_targeting:
          default: false
          title: Supports Geo Targeting
          type: boolean
        supports_inventory_configuration_authoring:
          default: false
          title: Supports Inventory Configuration Authoring
          type: boolean
        supports_inventory_profiles:
          default: false
          title: Supports Inventory Profiles
          type: boolean
        supports_inventory_sync:
          default: false
          title: Supports Inventory Sync
          type: boolean
        supports_materialization_preview:
          default: false
          title: Supports Materialization Preview
          type: boolean
        supports_pricing_recommendations:
          default: false
          title: Supports Pricing Recommendations
          type: boolean
        supports_realtime_reporting:
          default: false
          title: Supports Realtime Reporting
          type: boolean
        supports_reporting:
          default: false
          title: Supports Reporting
          type: boolean
        supports_reporting_sync:
          default: false
          title: Supports Reporting Sync
          type: boolean
        supports_signal_mapping_authoring:
          default: false
          title: Supports Signal Mapping Authoring
          type: boolean
        supports_webhooks:
          default: false
          title: Supports Webhooks
          type: boolean
        sync_streams:
          items:
            type: string
          title: Sync Streams
          type: array
        type:
          description: Adapter type identifier.
          title: Type
          type: string
        unsupported_features:
          items:
            $ref: '#/components/schemas/AdapterUnsupportedFeature'
          title: Unsupported Features
          type: array
      required:
      - type
      - contract_version
      - openapi_url
      title: AdapterCapabilitiesResponse
      type: object
    AdapterConfig:
      additionalProperties: false
      description: Mock adapter configuration (no real backend).
      properties:
        dry_run:
          default: false
          title: Dry Run
          type: boolean
        type:
          const: mock
          default: mock
          title: Type
          type: string
      title: MockAdapterConfig
      type: object
    AdapterSettingsSchemaResponse:
      additionalProperties: false
      description: Runtime adapter settings schema with template-macro metadata.
      properties:
        schema:
          additionalProperties: true
          title: Schema
          type: object
        template_macros:
          additionalProperties:
            items:
              $ref: '#/components/schemas/TemplateMacro'
            type: array
          title: Template Macros
          type: object
        type:
          title: Type
          type: string
      required:
      - type
      - schema
      title: AdapterSettingsSchemaResponse
      type: object
    AdapterSettingsValidationError:
      additionalProperties: false
      description: One validation error for adapter runtime settings.
      properties:
        field:
          title: Field
          type: string
        message:
          title: Message
          type: string
      required:
      - field
      - message
      title: AdapterSettingsValidationError
      type: object
    AdapterSettingsValidationResponse:
      additionalProperties: false
      description: Validation result for adapter runtime settings.
      properties:
        errors:
          items:
            $ref: '#/components/schemas/AdapterSettingsValidationError'
          title: Errors
          type: array
        preview:
          additionalProperties:
            type: string
          title: Preview
          type: object
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      title: AdapterSettingsValidationResponse
      type: object
    AdapterUnsupportedFeature:
      additionalProperties: false
      description: Machine-readable unsupported capability surfaced by adapter contracts.
      properties:
        feature:
          description: Stable unsupported feature identifier.
          minLength: 1
          title: Feature
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        remediation:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Remediation
      required:
      - feature
      - reason
      title: AdapterUnsupportedFeature
      type: object
    ApiError:
      additionalProperties: false
      description: Standard problem-detail shape used by every Tenant Management endpoint.
      properties:
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Details
        error:
          title: Error
          type: string
        message:
          title: Message
          type: string
      required:
      - error
      - message
      title: ApiError
      type: object
    TemplateMacro:
      additionalProperties: false
      description: One supported naming-template macro.
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
      required:
      - name
      - description
      title: TemplateMacro
      type: object
    UnsupportedFeature:
      additionalProperties: false
      description: Machine-readable unsupported capability surfaced by adapter contracts.
      properties:
        feature:
          description: Stable unsupported feature identifier.
          minLength: 1
          title: Feature
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        remediation:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Remediation
      required:
      - feature
      - reason
      title: AdapterUnsupportedFeature
      type: object
  securitySchemes:
    TenantManagementApiKey:
      in: header
      name: X-Tenant-Management-API-Key
      type: apiKey
externalDocs:
  description: Shared Tenant Management API OpenAPI document.
  url: ../tenant-management-openapi.json
info:
  description: Simulated ad server for testing and development; no real backend calls.
    This is an adapter-specific supplement. Shared tenant lifecycle, preview, status,
    sync, and test-connection operations are defined in the root Tenant Management
    OpenAPI document.
  title: Sales Agent Tenant Management Adapter Contract - Mock Ad Server
  version: '2026-05-01'
openapi: 3.1.0
paths:
  /adapters/mock/capabilities:
    get:
      operationId: get_mock_capabilities
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterCapabilities'
          description: Adapter capabilities.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unknown adapter type.
      security:
      - TenantManagementApiKey: []
      summary: Get Mock Ad Server tenant-management capabilities.
  /adapters/mock/openapi.json:
    get:
      operationId: get_mock_openapi
      responses:
        '200':
          description: OpenAPI document.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unknown adapter type.
      security:
      - TenantManagementApiKey: []
      summary: Get Mock Ad Server adapter contract OpenAPI document.
security:
- TenantManagementApiKey: []
servers:
- url: /api/v1/tenant-management
x-salesagent-adapter: mock
x-salesagent-adapter-contract-kind: adapter-specific-supplement
x-salesagent-candidate-generation: deterministic_sample_objects
x-salesagent-contract-version: '2026-05-01'
x-salesagent-normalization-notes:
- Mock contracts return deterministic sample objects for local and CI setup flows.
x-salesagent-search-limits:
  default_page_size: 50
  max_page_size: 100
x-salesagent-shared-openapi: ../tenant-management-openapi.json
x-salesagent-shared-tenant-endpoints:
- POST /tenants/preview-adapter
- POST /tenants/provision
- GET /tenants/{tenant_id}/status
- POST /tenants/{tenant_id}/refresh
- GET /tenants/{tenant_id}/sync-history
- PUT /tenants/{tenant_id}/adapter-config
- POST /tenants/{tenant_id}/adapter-config/test-connection
x-salesagent-supported-object-types:
- placement
- package
- creative_format
- audience_segment
- custom_targeting
x-salesagent-supported-signal-types: []
x-salesagent-sync-streams: []
