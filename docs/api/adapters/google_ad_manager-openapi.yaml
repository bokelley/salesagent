components:
  schemas:
    AdapterCapabilities:
      additionalProperties: false
      description: Full response from ``GET /adapters/{adapter_type}/capabilities``.
      properties:
        contract_version:
          description: Version of this adapter's tenant-management contract.
          title: Contract Version
          type: string
        inventory_entity_label:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Inventory Entity Label
        openapi_url:
          description: Adapter-specific OpenAPI reference URL.
          title: Openapi Url
          type: string
        reporting_bundled_with_inventory:
          default: false
          title: Reporting Bundled With Inventory
          type: boolean
        supported_object_types:
          items:
            type: string
          title: Supported Object Types
          type: array
        supported_pricing_models:
          items:
            type: string
          title: Supported Pricing Models
          type: array
        supported_signal_types:
          items:
            type: string
          title: Supported Signal Types
          type: array
        supports_audiences:
          default: false
          title: Supports Audiences
          type: boolean
        supports_custom_targeting:
          default: false
          title: Supports Custom Targeting
          type: boolean
        supports_dynamic_products:
          default: false
          title: Supports Dynamic Products
          type: boolean
        supports_forecasting:
          default: false
          title: Supports Forecasting
          type: boolean
        supports_geo_targeting:
          default: false
          title: Supports Geo Targeting
          type: boolean
        supports_inventory_configuration_authoring:
          default: false
          title: Supports Inventory Configuration Authoring
          type: boolean
        supports_inventory_profiles:
          default: false
          title: Supports Inventory Profiles
          type: boolean
        supports_inventory_sync:
          default: false
          title: Supports Inventory Sync
          type: boolean
        supports_materialization_preview:
          default: false
          title: Supports Materialization Preview
          type: boolean
        supports_pricing_recommendations:
          default: false
          title: Supports Pricing Recommendations
          type: boolean
        supports_realtime_reporting:
          default: false
          title: Supports Realtime Reporting
          type: boolean
        supports_reporting:
          default: false
          title: Supports Reporting
          type: boolean
        supports_reporting_sync:
          default: false
          title: Supports Reporting Sync
          type: boolean
        supports_signal_mapping_authoring:
          default: false
          title: Supports Signal Mapping Authoring
          type: boolean
        supports_webhooks:
          default: false
          title: Supports Webhooks
          type: boolean
        sync_streams:
          items:
            type: string
          title: Sync Streams
          type: array
        type:
          description: Adapter type identifier.
          title: Type
          type: string
        unsupported_features:
          items:
            $ref: '#/components/schemas/AdapterUnsupportedFeature'
          title: Unsupported Features
          type: array
      required:
      - type
      - contract_version
      - openapi_url
      title: AdapterCapabilitiesResponse
      type: object
    AdapterConfig:
      additionalProperties: false
      description: Google Ad Manager adapter configuration.
      properties:
        network_code:
          maxLength: 32
          minLength: 1
          title: Network Code
          type: string
        refresh_token:
          anyOf:
          - format: password
            type: string
            writeOnly: true
          - type: 'null'
          default: null
          title: Refresh Token
        service_account_email:
          maxLength: 255
          minLength: 3
          title: Service Account Email
          type: string
        service_account_key_json:
          format: password
          title: Service Account Key Json
          type: string
          writeOnly: true
        type:
          const: google_ad_manager
          default: google_ad_manager
          title: Type
          type: string
      required:
      - network_code
      - service_account_email
      - service_account_key_json
      title: GAMAdapterConfig
      type: object
    AdapterRuntimeConfig:
      additionalProperties: false
      description: GAM runtime settings that affect how buys are materialized.
      properties:
        auto_naming_enabled:
          default: true
          description: Allow {auto_name} in order_name_template to invoke tenant AI
            naming when AI configuration is available.
          title: Auto Naming Enabled
          type: boolean
        line_item_name_template:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          description: Template used for GAM line item names. Uses {macro} syntax.
          title: Line Item Name Template
          x-supported-macros:
          - description: Resolved parent GAM order name.
            name: order_name
          - description: Product name associated with the package.
            name: product_name
          - description: Package name from the request, falling back to product_name.
            name: package_name
          - description: 1-based package position in the media buy.
            name: package_index
        manual_approval_required:
          default: false
          description: Require manual approval before GAM orders are pushed live.
          title: Manual Approval Required
          type: boolean
        order_name_template:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
          description: Template used for GAM order names. Uses {macro} syntax and
            supports fallback syntax like {campaign_name|brand_name}.
          title: Order Name Template
          x-supported-macros:
          - description: Brand-derived campaign name; falls back to Campaign.
            name: campaign_name
          - description: Brand domain/name from the media-buy request.
            name: brand_name
          - description: Backward-compatible alias for brand_name.
            name: promoted_offering
          - description: AI-generated name when AI naming is enabled and configured.
            name: auto_name
          - description: Formatted flight date range.
            name: date_range
          - description: Month and year for the flight start.
            name: month_year
          - description: Pre-created media-buy/order identifier.
            name: media_buy_id
          - description: Backward-compatible alias for media_buy_id.
            name: buyer_ref
          - description: Number of packages in the media buy.
            name: package_count
          - description: Flight start date in YYYY-MM-DD format.
            name: start_date
          - description: Flight end date in YYYY-MM-DD format.
            name: end_date
        type:
          const: google_ad_manager
          default: google_ad_manager
          title: Type
          type: string
      title: GoogleAdManagerSettings
      type: object
    AdapterSettingsSchemaResponse:
      additionalProperties: false
      description: Runtime adapter settings schema with template-macro metadata.
      properties:
        schema:
          additionalProperties: true
          title: Schema
          type: object
        template_macros:
          additionalProperties:
            items:
              $ref: '#/components/schemas/TemplateMacro'
            type: array
          title: Template Macros
          type: object
        type:
          title: Type
          type: string
      required:
      - type
      - schema
      title: AdapterSettingsSchemaResponse
      type: object
    AdapterSettingsValidationError:
      additionalProperties: false
      description: One validation error for adapter runtime settings.
      properties:
        field:
          title: Field
          type: string
        message:
          title: Message
          type: string
      required:
      - field
      - message
      title: AdapterSettingsValidationError
      type: object
    AdapterSettingsValidationResponse:
      additionalProperties: false
      description: Validation result for adapter runtime settings.
      properties:
        errors:
          items:
            $ref: '#/components/schemas/AdapterSettingsValidationError'
          title: Errors
          type: array
        preview:
          additionalProperties:
            type: string
          title: Preview
          type: object
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      title: AdapterSettingsValidationResponse
      type: object
    AdapterUnsupportedFeature:
      additionalProperties: false
      description: Machine-readable unsupported capability surfaced by adapter contracts.
      properties:
        feature:
          description: Stable unsupported feature identifier.
          minLength: 1
          title: Feature
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        remediation:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Remediation
      required:
      - feature
      - reason
      title: AdapterUnsupportedFeature
      type: object
    ApiError:
      additionalProperties: false
      description: Standard problem-detail shape used by every Tenant Management endpoint.
      properties:
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Details
        error:
          title: Error
          type: string
        message:
          title: Message
          type: string
      required:
      - error
      - message
      title: ApiError
      type: object
    TemplateMacro:
      additionalProperties: false
      description: One supported naming-template macro.
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
      required:
      - name
      - description
      title: TemplateMacro
      type: object
    UnsupportedFeature:
      additionalProperties: false
      description: Machine-readable unsupported capability surfaced by adapter contracts.
      properties:
        feature:
          description: Stable unsupported feature identifier.
          minLength: 1
          title: Feature
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        remediation:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Remediation
      required:
      - feature
      - reason
      title: AdapterUnsupportedFeature
      type: object
  securitySchemes:
    TenantManagementApiKey:
      in: header
      name: X-Tenant-Management-API-Key
      type: apiKey
externalDocs:
  description: Shared Tenant Management API OpenAPI document.
  url: ../tenant-management-openapi.json
info:
  description: "Direct sold inventory via Google Ad Manager \u2014 line items, orders,\
    \ creatives. This is an adapter-specific supplement. Shared tenant lifecycle,\
    \ preview, status, sync, and test-connection operations are defined in the root\
    \ Tenant Management OpenAPI document."
  title: Sales Agent Tenant Management Adapter Contract - Google Ad Manager
  version: '2026-05-01'
openapi: 3.1.0
paths:
  /adapters/google_ad_manager/capabilities:
    get:
      operationId: get_google_ad_manager_capabilities
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterCapabilities'
          description: Adapter capabilities.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unknown adapter type.
      security:
      - TenantManagementApiKey: []
      summary: Get Google Ad Manager tenant-management capabilities.
  /adapters/google_ad_manager/config-schema:
    get:
      operationId: get_google_ad_manager_config_schema
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterSettingsSchemaResponse'
          description: Adapter runtime configuration schema.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
      security:
      - TenantManagementApiKey: []
      summary: Get Google Ad Manager runtime configuration schema.
  /adapters/google_ad_manager/openapi.json:
    get:
      operationId: get_google_ad_manager_openapi
      responses:
        '200':
          description: OpenAPI document.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Unknown adapter type.
      security:
      - TenantManagementApiKey: []
      summary: Get Google Ad Manager adapter contract OpenAPI document.
  /tenants/{tenant_id}/adapters/google_ad_manager/config:
    get:
      operationId: get_tenant_google_ad_manager_config
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterRuntimeConfig'
          description: Adapter runtime configuration.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant or adapter config not found.
      security:
      - TenantManagementApiKey: []
      summary: Get tenant Google Ad Manager runtime configuration.
    put:
      operationId: put_tenant_google_ad_manager_config
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterRuntimeConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterRuntimeConfig'
          description: Updated adapter runtime configuration.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid adapter runtime configuration.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant or adapter config not found.
      security:
      - TenantManagementApiKey: []
      summary: Update tenant Google Ad Manager runtime configuration.
  /tenants/{tenant_id}/adapters/google_ad_manager/config:validate:
    post:
      operationId: validate_tenant_google_ad_manager_config
      parameters:
      - in: path
        name: tenant_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterRuntimeConfig'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterSettingsValidationResponse'
          description: Adapter runtime configuration validation result.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Stored adapter connection configuration is incomplete.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant management API key is not authorized.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Tenant or adapter config not found.
      security:
      - TenantManagementApiKey: []
      summary: Validate tenant Google Ad Manager runtime configuration.
security:
- TenantManagementApiKey: []
servers:
- url: /api/v1/tenant-management
x-salesagent-adapter: google_ad_manager
x-salesagent-adapter-contract-kind: adapter-specific-supplement
x-salesagent-candidate-generation: hierarchy_rollup_recent_delivery
x-salesagent-contract-version: '2026-05-01'
x-salesagent-normalization-notes:
- GAM 1x1 and fluid size declarations are evidence for classification, not final creative
  formats.
- Large networks should use on-demand search and curated candidates instead of full
  raw ad-unit setup flows.
x-salesagent-search-limits:
  default_page_size: 50
  max_page_size: 100
x-salesagent-shared-openapi: ../tenant-management-openapi.json
x-salesagent-shared-tenant-endpoints:
- POST /tenants/preview-adapter
- POST /tenants/provision
- GET /tenants/{tenant_id}/status
- POST /tenants/{tenant_id}/refresh
- GET /tenants/{tenant_id}/sync-history
- PUT /tenants/{tenant_id}/adapter-config
- POST /tenants/{tenant_id}/adapter-config/test-connection
x-salesagent-supported-object-types:
- ad_unit
- placement
- creative_format
- targeting_key
- targeting_value
- advertiser
x-salesagent-supported-signal-types:
- custom_targeting
- audience_segment
x-salesagent-sync-streams:
- inventory
- custom_targeting
- advertisers
